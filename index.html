<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1E3A8A',    
                            cyan: '#0EA5E9',    
                            purple: '#8B5CF6',  
                            dark: '#0F172A',    
                            light: '#F8FAFC',   
                            gray: '#64748B'     
                        }
                    },
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide React Icons -->
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; overflow-x: hidden; }
        h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Montserrat', sans-serif; }
        
        /* Collage Grid Layout */
        .collage-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 200px;
            gap: 1rem;
        }
        
        @media (min-width: 768px) {
            .collage-grid {
                grid-template-columns: repeat(4, 1fr);
                grid-auto-rows: 250px;
                gap: 1.5rem;
            }
        }

        /* Span Classes for Collage Effect */
        .item-tall { grid-row: span 2; }
        .item-wide { grid-column: span 2; }
        .item-big { grid-column: span 2; grid-row: span 2; }
        
        @media (max-width: 767px) {
            .item-wide, .item-big { grid-column: span 2; grid-row: span 1; }
            .item-tall { grid-row: span 1; }
        }

        /* Page Transitions */
        .page-enter { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F8FAFC; }
        ::-webkit-scrollbar-thumb { background: #0EA5E9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #1E3A8A; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICONS WRAPPER ---
        const Icon = ({ name, size = 24, className = "" }) => {
            if (typeof lucideReact === 'undefined' || !lucideReact[name]) {
                return <span style={{ display: 'inline-block', width: size, height: size }}></span>;
            }
            const IconComponent = lucideReact[name];
            return <IconComponent size={size} className={className} />;
        };

        // --- ANIMATION WRAPPER (Scroll Reveal) ---
        const Reveal = ({ children, delay = 0, direction = 'up', className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            const getTransform = () => {
                if (direction === 'up') return 'translate-y-12';
                if (direction === 'down') return '-translate-y-12';
                if (direction === 'left') return 'translate-x-12';
                if (direction === 'right') return '-translate-x-12';
                return 'translate-y-0';
            };

            return (
                <div 
                    ref={ref} 
                    className={`transition-all duration-700 ease-out ${isVisible ? 'opacity-100 translate-y-0 translate-x-0' : `opacity-0 ${getTransform()}`} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // --- LOGO COMPONENT ---
        const Logo = ({ light = false }) => (
            <div className="flex items-center gap-3 cursor-pointer group">
                <div className="relative w-10 h-10 transform group-hover:rotate-12 transition-transform duration-500">
                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-md">
                        <circle cx="50" cy="50" r="45" fill="url(#globeGradient)" />
                        <path d="M 10 50 Q 50 20 90 50 Q 50 80 10 50" fill="none" stroke="#0EA5E9" strokeWidth="4" />
                        <path d="M 50 5 Q 80 50 50 95 Q 20 50 50 5" fill="none" stroke="#0EA5E9" strokeWidth="4" opacity="0.5"/>
                        <defs>
                            <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stopColor="#1E3A8A" />
                                <stop offset="50%" stopColor="#8B5CF6" />
                                <stop offset="100%" stopColor="#0EA5E9" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div className="flex flex-col leading-none">
                    <span className={`font-heading font-bold text-xl tracking-wide ${light ? 'text-white' : 'text-brand-cyan'}`}>INFLUENZA</span>
                    <span className="font-heading font-semibold text-xs tracking-widest text-brand-purple">EVENTS</span>
                </div>
            </div>
        );

        // --- MOCK DATA ---
        const servicesData = [
            { id: 1, icon: "Camera", title: "Event Photography", desc: "High-end, creative photography capturing every key moment of your tech summit or corporate event." },
            { id: 2, icon: "Video", title: "Cinematic Videography", desc: "4K highlight reels, full session recordings, and cinematic event films that tell your story." },
            { id: 3, icon: "Globe", title: "Live Streaming", desc: "Multi-camera live broadcasting to YouTube, Zoom, or custom platforms for global reach." },
            { id: 4, icon: "Mic", title: "Sound & Lighting", desc: "Professional audio-visual setups, stage lighting, and clear sound engineering." },
            { id: 5, icon: "Palette", title: "Creative Direction", desc: "Brand-aligned event concepts, stage design, and visual storytelling." },
            { id: 6, icon: "Users", title: "Event Management", desc: "End-to-end coordination, from venue booking to on-site logistics." }
        ];

        const portfolioImages = [
            { id: 1, url: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80", title: "Tech Summit Keynote", cat: "Conference", span: "item-big" },
            { id: 2, url: "https://images.unsplash.com/photo-1505373877841-8d25f7d46678?auto=format&fit=crop&q=80", title: "AI Panel Discussion", cat: "Panel", span: "item-tall" },
            { id: 3, url: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&q=80", title: "Hackathon Winners", cat: "Hackathon", span: "item-wide" },
            { id: 4, url: "https://images.unsplash.com/photo-1583095119932-98714cd9b6f8?auto=format&fit=crop&q=80", title: "Networking Session", cat: "Networking", span: "item-tall" },
            { id: 5, url: "https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&q=80", title: "Product Launch Stage", cat: "Launch", span: "item-wide" },
            { id: 6, url: "https://images.unsplash.com/photo-1558403194-611308249627?auto=format&fit=crop&q=80", title: "Crowd Engagement", cat: "Conference", span: "item-tall" },
            { id: 7, url: "https://images.unsplash.com/photo-1560439514-4e9645039924?auto=format&fit=crop&q=80", title: "VR Demo Station", cat: "Exhibition", span: "item-tall" },
            { id: 8, url: "https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&q=80", title: "Team Collaborating", cat: "Hackathon", span: "item-wide" },
            { id: 9, url: "https://images.unsplash.com/photo-1591115765373-5207764f72e7?auto=format&fit=crop&q=80", title: "Speaker Presentation", cat: "Conference", span: "item-tall" },
            { id: 10, url: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&q=80", title: "Startup Pitch", cat: "Pitch", span: "item-wide" },
            { id: 11, url: "https://images.unsplash.com/photo-1515169067868-5387ec356754?auto=format&fit=crop&q=80", title: "Tech Expo Booth", cat: "Exhibition", span: "item-tall" },
            { id: 12, url: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&q=80", title: "Developer Workshop", cat: "Workshop", span: "item-wide" }
        ];

        // --- SHARED COMPONENTS ---

        const SectionHeader = ({ title, subtitle, light = false }) => (
            <Reveal>
                <div className="text-center mb-16">
                    <span className="text-brand-cyan font-bold tracking-[0.2em] text-sm uppercase mb-2 block">{subtitle}</span>

        );

        const Navbar = ({ currentPage, setCurrentPage }) => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isOpen, setIsOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 30);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [

                { id: 'services', label: 'Services' },

            const handleNav = (id) => {
                setCurrentPage(id);

            return (

                        </div>

                        <div className="hidden lg:flex items-center space-x-8 text-sm font-semibold">
                            {navLinks.map(link => (
                                <button 
                                    key={link.id}

                                >
                                    {link.label}
                                    <span className={`absolute bottom-0 left-0 w-full h-0.5 bg-brand-cyan transform scale-x-0 transition-transform duration-300 group-hover:scale-x-100 ${currentPage === link.id ? 'scale-x-100' : ''}`}></span>
                                </button>
                            ))}
                        </div>

                        <div className="hidden lg:block">
                            <button onClick={() => handleNav('contact')} className="bg-brand-cyan text-white font-bold py-2.5 px-6 rounded-full hover:bg-brand-blue hover:shadow-lg hover:scale-105 active:scale-95 transition-all duration-300 text-sm shadow-md">
                                BOOK A SHOOT

                        </div>

                        <button className={`lg:hidden transition-transform duration-300 ${isOpen ? 'rotate-90' : ''} ${isScrolled || currentPage !== 'home' ? 'text-brand-dark' : 'text-white'}`} onClick={() => setIsOpen(!isOpen)}>
                            <Icon name={isOpen ? "X" : "Menu"} size={28} />
                        </button>
                    </div>

                    {/* Mobile Menu */}
                    <div className={`lg:hidden absolute top-full left-0 w-full bg-white shadow-xl overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-[400px] border-t border-gray-100' : 'max-h-0'}`}>
                        <div className="flex flex-col items-center py-6 space-y-4">
                            {navLinks.map(link => (
                                <button key={link.id} onClick={() => handleNav(link.id)} className="text-brand-dark hover:text-brand-cyan font-semibold w-full text-center py-2">
                                    {link.label}
                                </button>
                            ))}
                            <button onClick={() => handleNav('contact')} className="bg-brand-cyan text-white font-bold py-3 px-8 rounded-full mt-4 w-11/12 hover:bg-brand-blue transition">BOOK NOW</button>
                        </div>
                    </div>
                </nav>
            );
        };

        const Footer = ({ setCurrentPage }) => (
            <footer className="bg-brand-dark pt-16 pb-8 border-t-4 border-brand-cyan relative overflow-hidden">
                <div className="container mx-auto px-6 relative z-10">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
                        <div>
                            <Logo light={true} />
                            <p className="text-gray-400 text-sm leading-relaxed mt-6 mb-6">
                                Crafting extraordinary events and capturing timeless memories across Kenya.
                            </p>
                            <div className="flex gap-4">
                                {['Instagram', 'Twitter', 'Facebook', 'Linkedin'].map(icon => (
                                    <a key={icon} href="#" className="w-10 h-10 rounded-full bg-brand-blue/30 flex items-center justify-center text-brand-cyan hover:text-white hover:bg-brand-cyan hover:scale-110 hover:-translate-y-1 transition-all duration-300">
                                        <Icon name={icon} size={18} />
                                    </a>
                                ))}
                            </div>
                        </div>
                        
                        <div>
                            <h4 className="text-white font-bold mb-6 font-heading">Quick Links</h4>
                            <ul className="space-y-3 text-sm text-gray-400">
                                {['Home', 'Services', 'Portfolio', 'Contact'].map((link) => (
                                    <li key={link}>
                                        <button onClick={() => {setCurrentPage(link.toLowerCase()); window.scrollTo(0,0);}} className="hover:text-brand-cyan hover:translate-x-1 transition-all duration-300 inline-block">
                                            {link}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </div>

                        <div>
                            <h4 className="text-white font-bold mb-6 font-heading">Our Services</h4>
                            <ul className="space-y-3 text-sm text-gray-400">
                                {['Event Photography', 'Videography', 'Live Streaming', 'Sound & Lighting', 'Event Management'].map((service, i) => (
                                    <li key={i}>
                                        <button onClick={() => {setCurrentPage('services'); window.scrollTo(0,0);}} className="hover:text-brand-cyan hover:translate-x-1 transition-all duration-300 inline-block text-left">{service}</button>
                                    </li>
                                ))}
                            </ul>
                        </div>

                        <div>
                            <h4 className="text-white font-bold mb-6 font-heading">Contact Info</h4>
                            <ul className="space-y-4 text-sm text-gray-400">
                                <li className="flex items-start gap-3 group">
                                    <Icon name="MapPin" size={18} className="text-brand-cyan flex-shrink-0 group-hover:scale-110 transition" />
                                    <span>Nairobi, Kenya<br/>Westlands Area</span>
                                </li>
                                <li className="flex items-center gap-3 group">
                                    <Icon name="Phone" size={18} className="text-brand-cyan flex-shrink-0 group-hover:scale-110 transition" />
                                    <span>+254 700 000 000</span>
                                </li>
                                <li className="flex items-center gap-3 group">
                                    <Icon name="Mail" size={18} className="text-brand-cyan flex-shrink-0 group-hover:scale-110 transition" />
                                    <span>hello@influenzaevents.co.ke</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    
                    <div className="border-t border-brand-blue/30 pt-8 flex flex-col md:flex-row justify-between items-center text-xs text-gray-500">
                        <p>&copy; {new Date().getFullYear()} Influenza Events Kenya. All rights reserved.</p>
                        <div className="flex gap-6 mt-4 md:mt-0">
                            <a href="#" className="hover:text-white transition">Privacy Policy</a>
                            <a href="#" className="hover:text-white transition">Terms & Conditions</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const FloatingElements = () => {
            const [showTopBtn, setShowTopBtn] = useState(false);

            useEffect(() => {
                const handleScroll = () => setShowTopBtn(window.scrollY > 500);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="fixed bottom-6 right-6 flex flex-col gap-4 z-50 items-end">
                    <button 
                        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                        className={`bg-brand-dark text-white p-3 rounded-full shadow-lg hover:bg-brand-cyan transition-all duration-300 ${showTopBtn ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-10 scale-50 pointer-events-none'}`}
                    >
                        <Icon name="ArrowUp" size={24} />
                    </button>

                    <a href="https://wa.me/254700000000?text=Hello%20Influenza%20Events,%20I%20would%20like%20to%20inquire%20about%20your%20services." 
                       target="_blank" 
                       className="bg-[#25D366] text-white p-4 rounded-full shadow-xl hover:scale-110 hover:-translate-y-1 transition-all duration-300 flex items-center justify-center relative group">
                        <span className="absolute right-full mr-4 bg-white text-brand-dark text-xs font-bold py-2 px-4 rounded-lg shadow-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
                            Chat with us
                        </span>

                    </a>
                </div>

        };

        // --- PAGES ---

        const HomePage = ({ setCurrentPage }) => (
            <div className="page-enter">
                {/* Hero */}
                <section className="relative h-screen flex items-center bg-brand-dark overflow-hidden">
                    <div className="absolute inset-0">
                        <img src="https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&q=80" alt="Event" className="w-full h-full object-cover opacity-40 scale-105 animate-[pulse_20s_ease-in-out_infinite]" />
                        <div className="absolute inset-0 bg-gradient-to-r from-brand-dark via-brand-dark/80 to-transparent"></div>
                    </div>
                    <div className="container mx-auto px-6 relative z-10 pt-20">
                        <div className="max-w-3xl">
                            <Reveal delay={100}>
                                <span className="text-brand-cyan font-bold tracking-[0.2em] text-sm uppercase mb-4 block">Events. Experiences. Excellence.</span>
                            </Reveal>
                            <Reveal delay={200}>
                                <h1 className="text-5xl md:text-7xl font-bold text-white leading-tight mb-6 font-heading">
                                    WE CAPTURE THE PULSE OF INNOVATION.

                            <Reveal delay={300}>

                    <div className="container mx-auto px-6 relative z-10 text-center">
                        <Reveal>
                            <h2 className="text-4xl md:text-5xl font-bold text-white font-heading mb-6">LET'S MAKE YOUR NEXT EVENT UNFORGETTABLE.</h2>
                            <p className="text-brand-light/80 text-lg mb-10 max-w-2xl mx-auto">Tell us your vision. We'll help you bring it to life with our premium event services.</p>
                            <button onClick={() => setCurrentPage('contact')} className="bg-brand-cyan text-white font-bold py-4 px-10 rounded-full hover:bg-white hover:text-brand-dark hover:scale-105 active:scale-95 transition-all duration-300 text-lg shadow-xl shadow-brand-cyan/30">
                                START YOUR PROJECT
                            </button>
                        </Reveal>
                    </div>
                </section>
            </div>
        );

        const ServicesPage = ({ setCurrentPage }) => (
            <div className="page-enter pt-24">
                <div className="bg-brand-dark py-20 text-center relative overflow-hidden">
                    <div className="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80')] bg-cover bg-center hover:scale-105 transition-transform duration-10000"></div>
                    <div className="relative z-10 container mx-auto px-6">
                        <Reveal>
                            <h1 className="text-4xl md:text-5xl font-bold text-white font-heading mb-4">OUR SERVICES</h1>
                            <p className="text-brand-cyan font-semibold tracking-widest uppercase text-sm">Comprehensive Event Solutions</p>
                        </Reveal>
                    </div>
                </div>

                <section className="py-24 bg-white">
                    <div className="container mx-auto px-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {servicesData.map((service, i) => (
                                <Reveal key={service.id} delay={i * 100}>
                                    <div className="bg-brand-light rounded-3xl p-8 shadow-sm hover:shadow-2xl transition-all duration-500 group h-full flex flex-col border border-transparent hover:border-brand-cyan/30">
                                        <div className="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mb-8 shadow-md group-hover:bg-brand-cyan group-hover:scale-110 transition-all duration-300">
                                            <Icon name={service.icon} size={36} className="text-brand-cyan group-hover:text-white transition duration-300" />
                                        </div>
                                        <h3 className="text-2xl font-bold text-brand-dark mb-4 font-heading group-hover:text-brand-cyan transition">{service.title}</h3>
                                        <p className="text-brand-gray mb-8 flex-grow">{service.desc}</p>
                                        <button onClick={() => setCurrentPage('contact')} className="text-brand-purple font-bold text-sm flex items-center gap-2 group-hover:gap-3 transition-all mt-auto">
                                            Book This Service <Icon name="ArrowRight" size={16} />
                                        </button>
                                    </div>
                                </Reveal>
                            ))}
                        </div>
                    </div>
                </section>
            </div>
        );

        const PortfolioPage = () => {
            const [lightboxIndex, setLightboxIndex] = useState(null);
            const [filter, setFilter] = useState("All");

            const categories = ["All", "Conference", "Hackathon", "Networking", "Exhibition"];
            const filteredImages = filter === "All" ? portfolioImages : portfolioImages.filter(img => img.cat === filter);

            const handleNext = useCallback((e) => {
                e.stopPropagation();
                setLightboxIndex((prev) => (prev === filteredImages.length - 1 ? 0 : prev + 1));
            }, [filteredImages]);

            const handlePrev = useCallback((e) => {
                e.stopPropagation();
                setLightboxIndex((prev) => (prev === 0 ? filteredImages.length - 1 : prev - 1));
            }, [filteredImages]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (lightboxIndex === null) return;
                    if (e.key === 'Escape') setLightboxIndex(null);
                    if (e.key === 'ArrowRight') handleNext(e);
                    if (e.key === 'ArrowLeft') handlePrev(e);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [lightboxIndex, handleNext, handlePrev]);

            return (
                <div className="page-enter pt-24">
                    <div className="bg-brand-dark py-20 text-center relative overflow-hidden">
                        <div className="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1459749411175-04bf5292ceea?auto=format&fit=crop&q=80')] bg-cover bg-center"></div>
                        <div className="relative z-10 container mx-auto px-6">
                            <Reveal>
                                <h1 className="text-4xl md:text-5xl font-bold text-white font-heading mb-4">TECH PORTFOLIO</h1>
                                <p className="text-brand-cyan font-semibold tracking-widest uppercase text-sm">Creative Image Collage</p>
                            </Reveal>
                        </div>
                    </div>

                    <section className="py-20 bg-brand-light min-h-screen">
                        <div className="container mx-auto px-4 md:px-6">
                            {/* Filters */}
                            <Reveal>
                                <div className="flex flex-wrap justify-center gap-3 mb-12">
                                    {categories.map(cat => (
                                        <button 
                                            key={cat} 
                                            onClick={() => { setFilter(cat); setLightboxIndex(null); }}
                                            className={`px-6 py-2 text-sm font-bold rounded-full transition-all duration-300 ${filter === cat ? 'bg-brand-purple text-white shadow-lg scale-105' : 'bg-white text-brand-dark hover:bg-gray-200 hover:scale-105 shadow-sm'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </Reveal>

                            {/* Collage Grid */}
                            <div className="collage-grid">
                                {filteredImages.map((img, index) => (
                                    <Reveal key={img.id} delay={(index % 4) * 100} className={`${img.span} relative group rounded-2xl overflow-hidden cursor-pointer shadow-sm hover:shadow-2xl transition-all duration-500`}>
                                        <div onClick={() => setLightboxIndex(index)} className="w-full h-full relative">
                                            <img 
                                                src={img.url} 
                                                alt={img.title} 
                                                className="w-full h-full object-cover group-hover:scale-110 transition duration-700 ease-in-out" 
                                                loading="lazy"
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-brand-dark/90 via-brand-dark/20 to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col justify-end p-4 md:p-6">
                                                <span className="text-brand-cyan text-xs md:text-sm font-bold tracking-wider uppercase mb-1 transform translate-y-4 group-hover:translate-y-0 transition duration-300">
                                                    {img.cat}
                                                </span>
                                                <h3 className="text-white text-lg md:text-xl font-bold font-heading transform translate-y-4 group-hover:translate-y-0 transition duration-300 delay-75">
                                                    {img.title}
                                                </h3>
                                                <div className="mt-3 transform translate-y-4 group-hover:translate-y-0 transition duration-300 delay-100">
                                                    <span className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-brand-cyan text-white">
                                                        <Icon name="Maximize" size={14} />
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </Reveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Lightbox Modal */}
                    {lightboxIndex !== null && (
                        <div 
                            className="fixed inset-0 z-[100] bg-brand-dark/95 backdrop-blur-md flex items-center justify-center p-4 md:p-12 transition-opacity duration-300"
                            onClick={() => setLightboxIndex(null)}
                        >
                            <button 
                                className="absolute top-6 right-6 text-white hover:text-brand-cyan hover:rotate-90 transition-all duration-300 z-10"
                                onClick={() => setLightboxIndex(null)}
                            >
                                <Icon name="X" size={40} />
                            </button>

                            <button 
                                className="absolute left-4 md:left-10 text-white/50 hover:text-brand-cyan hover:scale-125 transition-all duration-300 z-10 p-2 bg-black/20 rounded-full"
                                onClick={handlePrev}
                            >
                                <Icon name="ChevronLeft" size={48} />
                            </button>

                            <div className="relative max-w-6xl w-full max-h-full flex flex-col items-center" onClick={(e) => e.stopPropagation()}>
                                <img 
                                    src={filteredImages[lightboxIndex].url} 
                                    alt={filteredImages[lightboxIndex].title} 
                                    className="max-h-[80vh] w-auto max-w-full object-contain rounded-lg shadow-2xl animate-[fadeIn_0.3s_ease-out]" 
                                />
                                <div className="text-center mt-4 text-white">
                                    <h3 className="text-2xl font-bold font-heading">{filteredImages[lightboxIndex].title}</h3>
                                    <p className="text-brand-cyan text-sm tracking-widest uppercase mt-1">{filteredImages[lightboxIndex].cat}</p>
                                </div>
                            </div>

                            <button 
                                className="absolute right-4 md:right-10 text-white/50 hover:text-brand-cyan hover:scale-125 transition-all duration-300 z-10 p-2 bg-black/20 rounded-full"
                                onClick={handleNext}
                            >
                                <Icon name="ChevronRight" size={48} />
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const ContactPage = () => (
            <div className="page-enter pt-24">
                <div className="bg-brand-dark py-20 text-center relative overflow-hidden">
                    <div className="relative z-10 container mx-auto px-6">
                        <Reveal>
                            <h1 className="text-4xl md:text-5xl font-bold text-white font-heading mb-4">CONTACT US</h1>
                            <p className="text-brand-cyan font-semibold tracking-widest uppercase text-sm">Let's Plan Your Next Event</p>
                        </Reveal>
                    </div>
                </div>

                <section className="py-24 bg-white">
                    <div className="container mx-auto px-6">
                        <div className="flex flex-col lg:flex-row gap-16">
                            {/* Contact Info */}
                            <Reveal direction="right" className="w-full lg:w-1/3">
                                <h2 className="text-3xl font-bold text-brand-dark mb-6 font-heading">Get In Touch</h2>
                                <p className="text-brand-gray mb-10 text-lg">Have an upcoming tech summit, corporate launch, or private event? Fill out the form or reach out to us directly. We'd love to hear from you.</p>
                                
                                <div className="space-y-8">
                                    <div className="flex items-start gap-4 group">
                                        <div className="w-14 h-14 bg-brand-cyan/10 rounded-2xl flex items-center justify-center flex-shrink-0 group-hover:bg-brand-cyan group-hover:scale-110 transition-all duration-300">
                                            <Icon name="MapPin" size={28} className="text-brand-cyan group-hover:text-white transition duration-300" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-brand-dark font-heading text-lg">Location</h4>
                                            <p className="text-brand-gray mt-1">Westlands Area<br/>Nairobi, Kenya</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-4 group">
                                        <div className="w-14 h-14 bg-brand-purple/10 rounded-2xl flex items-center justify-center flex-shrink-0 group-hover:bg-brand-purple group-hover:scale-110 transition-all duration-300">
                                            <Icon name="Phone" size={28} className="text-brand-purple group-hover:text-white transition duration-300" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-brand-dark font-heading text-lg">Phone</h4>
                                            <p className="text-brand-gray mt-1">+254 700 000 000</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-4 group">
                                        <div className="w-14 h-14 bg-brand-blue/10 rounded-2xl flex items-center justify-center flex-shrink-0 group-hover:bg-brand-blue group-hover:scale-110 transition-all duration-300">
                                            <Icon name="Mail" size={28} className="text-brand-blue group-hover:text-white transition duration-300" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-brand-dark font-heading text-lg">Email</h4>
                                            <p className="text-brand-gray mt-1">hello@influenzaevents.co.ke</p>
                                        </div>
                                    </div>
                                </div>
                            </Reveal>

                            {/* Form */}
                            <Reveal direction="left" delay={200} className="w-full lg:w-2/3">
                                <form className="bg-brand-light p-8 md:p-12 rounded-3xl shadow-sm border border-gray-100" onSubmit={(e) => { e.preventDefault(); alert("Message sent! (Frontend mock)"); e.target.reset(); }}>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                        <div>
                                            <label className="block text-brand-dark font-semibold mb-2 text-sm">Full Name</label>
                                            <input type="text" className="w-full px-5 py-4 rounded-xl border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition hover:border-brand-cyan bg-white" placeholder="John Doe" required />
                                        </div>
                                        <div>
                                            <label className="block text-brand-dark font-semibold mb-2 text-sm">Email Address</label>
                                            <input type="email" className="w-full px-5 py-4 rounded-xl border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition hover:border-brand-cyan bg-white" placeholder="john@example.com" required />
                                        </div>
                                    </div>
                                    <div className="mb-6">
                                        <label className="block text-brand-dark font-semibold mb-2 text-sm">Event Type</label>
                                        <select className="w-full px-5 py-4 rounded-xl border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition bg-white hover:border-brand-cyan cursor-pointer">
                                            <option>Tech Conference / Summit</option>
                                            <option>Corporate Event</option>
                                            <option>Product Launch</option>
                                            <option>Hackathon</option>
                                            <option>Other</option>
                                        </select>
                                    </div>
                                    <div className="mb-8">
                                        <label className="block text-brand-dark font-semibold mb-2 text-sm">Message</label>
                                        <textarea rows="5" className="w-full px-5 py-4 rounded-xl border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition hover:border-brand-cyan bg-white" placeholder="Tell us about your event, dates, and requirements..." required></textarea>
                                    </div>
                                    <button type="submit" className="bg-brand-cyan text-white font-bold py-4 px-10 rounded-full hover:bg-brand-blue hover:shadow-xl hover:-translate-y-1 active:translate-y-0 transition-all duration-300 shadow-lg shadow-brand-cyan/30 w-full md:w-auto flex items-center justify-center gap-2">
                                        SEND MESSAGE <Icon name="Send" size={18} />
                                    </button>
                                </form>
                            </Reveal>
                        </div>
                    </div>
                </section>
            </div>
        );

        // --- MAIN APP & ROUTER ---
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');

            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'services': return <ServicesPage setCurrentPage={setCurrentPage} />;
                    case 'portfolio': return <PortfolioPage />;
                    case 'contact': return <ContactPage />;
                    default: return <HomePage setCurrentPage={setCurrentPage} />;
                }
            }

            return (
                <div className="relative min-h-screen flex flex-col">
                    <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    <main className="flex-grow">
                        {renderPage()}
                    </main>
                    <Footer setCurrentPage={setCurrentPage} />
                    <FloatingElements />
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (error) {
            document.getElementById('root').innerHTML = `<div style="padding:20px;color:red;"><h2>Error</h2><p>${error.message}</p></div>`;
            console.error(error);
        }
    </script>
</body>
</html>
