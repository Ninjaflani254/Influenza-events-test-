<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS WRAPPER ---
        const Icon = ({ name, size = 24, className = "" }) => {
            if (typeof lucideReact === 'undefined' || !lucideReact[name]) {
                return <span style={{ display: 'inline-block', width: size, height: size }}></span>;
            }
            const IconComponent = lucideReact[name];
            return <IconComponent size={size} className={className} />;
        };

        // --- ANIMATION WRAPPER (Scroll Reveal) ---
        const Reveal = ({ children, delay = 0, direction = 'up' }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            const getTransform = () => {
                if (direction === 'up') return 'translate-y-12';
                if (direction === 'down') return '-translate-y-12';
                if (direction === 'left') return 'translate-x-12';
                if (direction === 'right') return '-translate-x-12';
                return 'translate-y-0';
            };

            return (
                <div 
                    ref={ref} 
                    className={`transition-all duration-700 ease-out ${isVisible ? 'opacity-100 translate-y-0 translate-x-0' : `opacity-0 ${getTransform()}`}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // --- ANIMATED COUNTER ---
        const AnimatedCounter = ({ end, duration = 2000, suffix = "" }) => {
            const [count, setCount] = useState(0);
            const ref = useRef(null);
            const [hasStarted, setHasStarted] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting && !hasStarted) {
                        setHasStarted(true);
                    }
                }, { threshold: 0.5 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [hasStarted]);

            useEffect(() => {
                if (!hasStarted) return;
                let startTime = null;
                const animate = (currentTime) => {
                    if (!startTime) startTime = currentTime;
                    const progress = Math.min((currentTime - startTime) / duration, 1);
                    setCount(Math.floor(progress * end));
                    if (progress < 1) requestAnimationFrame(animate);
                };
                requestAnimationFrame(animate);
            }, [hasStarted, end, duration]);

            return <span ref={ref}>{count}{suffix}</span>;
        };

            { id: 2, title: "Corporate Events", desc: "Conferences, launches, and team building.", img: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80" },

            { id: 6, title: "Equipment Hire", desc: "Sound, lighting, and staging solutions.", img: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&q=80" }

        };

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                        <div>
                                            <label className="block text-brand-dark font-semibold mb-2 text-sm">Full Name</label>
                                            <input type="text" className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition hover:border-brand-cyan" placeholder="John Doe" required />
                                        </div>
                                        <div>
                                            <label className="block text-brand-dark font-semibold mb-2 text-sm">Email Address</label>
                                            <input type="email" className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition hover:border-brand-cyan" placeholder="john@example.com" required />
                                        </div>
                                    </div>
                                    <div className="mb-6">
                                        <label className="block text-brand-dark font-semibold mb-2 text-sm">Event Type</label>
                                        <select className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition bg-white hover:border-brand-cyan cursor-pointer">
                                            <option>Corporate Event</option>
                                            <option>Wedding</option>
                                            <option>Conference</option>
                                            <option>Concert</option>
                                            <option>Other</option>
                                        </select>
                                    </div>
                                    <div className="mb-6">
                                        <label className="block text-brand-dark font-semibold mb-2 text-sm">Message</label>
                                        <textarea rows="4" className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand-cyan focus:ring-2 focus:ring-brand-cyan/20 transition hover:border-brand-cyan" placeholder="Tell us about your event..." required></textarea>
                                    </div>
                                    <button type="submit" className="bg-brand-cyan text-white font-bold py-4 px-10 rounded-full hover:bg-brand-blue hover:shadow-xl hover:-translate-y-1 active:translate-y-0 transition-all duration-300 shadow-lg shadow-brand-cyan/30 w-full md:w-auto">
                                        SEND MESSAGE
                                    </button>
                                </form>
                            </Reveal>
                        </div>
                    </div>
                </section>
            </div>
        );

        // --- MAIN APP & ROUTER ---
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');

            const renderPage = () => {
                switch(currentPage) {
                    case 'home': return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'about': return <AboutPage />;
                    case 'services': return <ServicesPage setCurrentPage={setCurrentPage} />;
                    case 'portfolio': return <PortfolioPage />;
                    case 'pricing': return <PricingPage setCurrentPage={setCurrentPage} />;
                    case 'contact': return <ContactPage />;
                    default: return <HomePage setCurrentPage={setCurrentPage} />;
                }
            }

            return (
                <div className="relative min-h-screen flex flex-col">
                    <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    <main className="flex-grow">
                        {renderPage()}
                    </main>
                    <Footer setCurrentPage={setCurrentPage} />
                    <FloatingElements />
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (error) {
            document.getElementById('root').innerHTML = `<div style="padding:20px;color:red;"><h2>Error</h2><p>${error.message}</p></div>`;
            console.error(error);
        }
    </script>
</body>
</html>
